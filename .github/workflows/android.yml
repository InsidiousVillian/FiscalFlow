# Android CI
#
# Builds the FiscalFlow debug APK and runs unit tests on every push and
# pull request. Instrumented (androidTest) tests are intentionally skipped
# here because they require an Android emulator, which is slow and costly
# to spin up on GitHub Actions runners. Run them locally via
# `./gradlew connectedAndroidTest` against an emulator/device.
#
# References:
#   https://github.com/marketplace/actions/automated-build-android-app-with-github-action
#   https://github.com/IMAD5112/Github-actions/blob/main/.github/workflows/build.yml
name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      # Pull the repo contents into the runner
      - name: Checkout source
        uses: actions/checkout@v4

      # FiscalFlow targets JDK 17 (AGP 8.x requires it). Use Temurin distribution.
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Extra Gradle cache layer for wrapper + dependency caches.
      # actions/setup-java above already caches ~/.gradle/caches, this
      # covers the wrapper distribution as well.
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Ensure the wrapper script is executable on the Linux runner
      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Build the debug APK
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Run JVM unit tests for the debug variant.
      # Instrumented tests are skipped here (see file header).
      - name: Run unit tests (debug)
        run: ./gradlew testDebugUnitTest --stacktrace

      # Publish the APK so reviewers can download it from the run's
      # "Artifacts" section without cloning the repo.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also upload unit test reports so failures are easy to inspect.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
